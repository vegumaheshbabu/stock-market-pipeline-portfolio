name: Stock Market Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest pyspark confluent-kafka requests pandas

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: pip install databricks-cli

      - name: Deploy notebooks to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks workspace import notebooks/Bronze_Notebook.py /Workspace/Users/saivenkata0206@gmail.com/stock-market-pipeline/notebooks/Bronze_Notebook --language PYTHON --overwrite
          databricks workspace import notebooks/Silver_Notebook.py /Workspace/Users/saivenkata0206@gmail.com/stock-market-pipeline/notebooks/Silver_Notebook --language PYTHON --overwrite
          databricks workspace import notebooks/Gold_Notebook.py /Workspace/Users/saivenkata0206@gmail.com/stock-market-pipeline/notebooks/Gold_Notebook --language PYTHON --overwrite
          echo "✅ Notebooks deployed to correct Databricks location!"

  deploy_producer:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy producer to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu
            curl -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              -o /home/ubuntu/producer.py \
              https://raw.githubusercontent.com/vegumaheshbabu/stock-market-pipeline/main/notebooks/producer.py
            echo "✅ Producer updated!"
            head -5 /home/ubuntu/producer.py
